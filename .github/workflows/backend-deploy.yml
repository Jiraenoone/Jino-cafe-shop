name: Deploy Backend & Worker to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'worker/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Container Apps

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure (Federated OIDC / Service Principal)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # ── Build & Push Backend API Image ───────────────────────
      - name: Build & Push Backend API Image
        run: |
          IMAGE_URI="${{ secrets.ACR_NAME }}.azurecr.io/jino-cafe-backend:${{ github.sha }}"
          LATEST_URI="${{ secrets.ACR_NAME }}.azurecr.io/jino-cafe-backend:latest"
          docker build -t $IMAGE_URI -t $LATEST_URI ./backend
          docker push $IMAGE_URI
          docker push $LATEST_URI

      # ── Build & Push Worker Image ────────────────────────────
      - name: Build & Push Worker Image
        run: |
          IMAGE_URI="${{ secrets.ACR_NAME }}.azurecr.io/jino-cafe-worker:${{ github.sha }}"
          LATEST_URI="${{ secrets.ACR_NAME }}.azurecr.io/jino-cafe-worker:latest"
          docker build -t $IMAGE_URI -t $LATEST_URI ./worker
          docker push $IMAGE_URI
          docker push $LATEST_URI

      # ── Deploy to Azure Container Apps ───────────────────────
      - name: Update Backend Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ secrets.ACA_BACKEND_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/jino-cafe-backend:${{ github.sha }}

      - name: Update Worker Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ secrets.ACA_WORKER_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/jino-cafe-worker:${{ github.sha }}
